

<div class="container-fluid" id="footer-content">

    <footer class='bg-light navbar-light' id='footer'>

        <div class="row d-flex align-items-center">

          <!-- Grid column -->
          <div class="col-12 col-md-3">
            <!--Copyright and image credit-->
	          <p class="text-center text-md-left">© {{ copyright_year }} Copyright: {{ copyright | safe }} </p>
          </div>

          <!-- Grid column -->
          <div class="col-12 col-md-2 version-info">
            <p class="text-center text-md-left">version: {{version}}</p>
          </div>

          <!-- Grid column -->
          <div class="col-12 col-md-3">
            <p class="text-center text-md-left">Telescope image credit: David R. Law</p>
          </div>
          <!-- Grid column -->

          <!-- Grid column -->
          <div class="col-12 col-md-4">
            <!-- Social buttons -->
            <div class="text-center text-md-right">
              <ul class="list-unstyled list-inline">
                {% for item in media %} 
                <li class="list-inline-item"><a href="{{ item.url }}"><i class="{{ item.icon }}"{% if item.aria_hidden %}aria-hidden="true"{% endif %}></i></a></li> 
                {% endfor %}
                <li class="list-inline-item"><a class="btn-default btn-lg" href='#'><i class="fa-solid fa-circle-arrow-up fa-fw"></i></i></a></li>
              </ul>
            </div>

          </div>
          <!-- Grid column -->

        </div>
        <!-- Grid row -->

    </footer>

</div>
