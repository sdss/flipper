[project]
name = "flipper"
version = "1.0.0dev"
description = "home splash page for SDSS"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [
  {name = "Sean Morrison", email = "smorris0@Illinois.edu"},
  {name = "Brian Cherinka", email = "bcherinka@stsci.edu" }
]

dependencies = [
  "jinja2",
  "sdsstools",
  "pyyaml",
]

[project.urls]
Repository = "https://github.com/sdss/flipper"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["python"]

[project.scripts]
flipper = "flipper.cli:cli"
flipper_snapshot = "flipper.cli:cli_create_snaps"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-sugar>=1.0.0",
  "pytest-cov",
]

snap = [
  "playwright",
  "Pillow",
  "PyYAML"
]

